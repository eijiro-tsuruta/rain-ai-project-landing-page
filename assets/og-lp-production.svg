<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">熊本のLP制作 Rain AI Project</title>
  <desc id="desc">伝わるLPを、事業の力に。買い切り・自分で投稿・AI更新の3プラン。</desc>
  <defs>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#ffffff" stroke-opacity=".035"/></pattern>
    <linearGradient id="paper" x2="1" y2="1"><stop stop-color="#edf5f8"/><stop offset="1" stop-color="#cadfe7"/></linearGradient>
  </defs>
  <rect width="1200" height="630" fill="#061724"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <path d="M54 119H1146" stroke="#ffffff" stroke-opacity=".2"/>
  <g font-family="Hiragino Kaku Gothic ProN, Hiragino Sans, sans-serif">
    <text x="56" y="77" fill="#ffffff" font-size="25" font-weight="700" letter-spacing="2.5">RAIN AI PROJECT</text>
    <text x="1144" y="77" fill="#f5d28d" font-size="23" text-anchor="end" font-weight="600">熊本のLP制作</text>
    <text x="56" y="187" fill="#f5d28d" font-family="Arial, sans-serif" font-size="13" letter-spacing="3">LANDING PAGES FOR LOCAL BUSINESS</text>
    <g font-size="67" font-weight="800" letter-spacing="-3">
      <text x="51" y="287" fill="#ffffff">伝わるLPを、</text>
      <text x="51" y="375" fill="#f5d28d">事業の力に。</text>
    </g>
    <text x="56" y="435" fill="#cedce4" font-size="22">制作から、検索・問い合わせ・更新まで。</text>
    <g font-size="19" font-weight="600" text-anchor="middle">
      <rect x="56" y="498" width="134" height="48" rx="24" fill="#f5d28d"/>
      <text x="123" y="529" fill="#09243a">買い切り</text>
      <rect x="204" y="498" width="168" height="48" rx="24" fill="none" stroke="#7692a3"/>
      <text x="288" y="529" fill="#ffffff">自分で投稿</text>
      <rect x="386" y="498" width="134" height="48" rx="24" fill="none" stroke="#7692a3"/>
      <text x="453" y="529" fill="#ffffff">AI更新</text>
    </g>
    <text x="56" y="590" fill="#7f9aaa" font-family="Arial, sans-serif" font-size="14" letter-spacing="1">rainaiproject.com</text>
    <!-- A schematic landing page, not a client example. -->
    <rect x="742" y="177" width="397" height="379" rx="13" fill="#020d16" opacity=".5"/>
    <rect x="730" y="165" width="397" height="379" rx="13" fill="#f8fafb"/>
    <path d="M743 165H1114Q1127 165 1127 178V202H730V178Q730 165 743 165" fill="#d9e5eb"/>
    <g fill="#7a98a8"><circle cx="750" cy="183" r="3"/><circle cx="763" cy="183" r="3"/><circle cx="776" cy="183" r="3"/></g>
    <rect x="827" y="177" width="190" height="12" rx="6" fill="#ffffff" opacity=".7"/>
    <rect x="750" y="222" width="357" height="203" rx="4" fill="url(#paper)"/>
    <path d="M990 425V307L1042 269L1107 315V425" fill="#9ebdca"/>
    <path d="M969 425L1107 327V425" fill="#799eb0"/>
    <circle cx="1062" cy="260" r="16" fill="#f5d28d"/>
    <text x="771" y="250" fill="#42677c" font-family="Arial, sans-serif" font-size="9" letter-spacing="1.5">YOUR BUSINESS, YOUR STORY.</text>
    <text x="770" y="304" fill="#09243a" font-size="27" font-weight="700">届けたい価値を、</text>
    <text x="770" y="345" fill="#09243a" font-size="27" font-weight="700">ひとつのページに。</text>
    <rect x="771" y="374" width="125" height="27" rx="3" fill="#09243a"/>
    <path d="M790 387H850M864 383L869 387L864 391" stroke="#ffffff" fill="none" stroke-width="2"/>
    <g fill="#dce6eb"><rect x="750" y="444" width="104" height="65" rx="3"/><rect x="876" y="444" width="104" height="65" rx="3"/><rect x="1003" y="444" width="104" height="65" rx="3"/></g>
    <g stroke="#7995a5" stroke-width="3"><path d="M765 461H810M765 473H838M765 485H827M891 461H936M891 473H964M891 485H953M1018 461H1063M1018 473H1091M1018 485H1080"/></g>
